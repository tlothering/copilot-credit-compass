name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      imageTag:
        description: 'Image tag to deploy. Defaults to the commit SHA.'
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# OIDC federated credentials only. There is no secret in this repository that
# can deploy anything: `id-token: write` mints a short-lived token for the
# federated identity credential configured on the app registration.
permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Gate the image on the same checks CI runs. A tag that reaches the
      # registry should always be one that passed.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      - name: Resolve image reference
        id: meta
        run: |
          TAG="${{ inputs.imageTag || github.sha }}"
          REPO=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${REPO}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  deploy:
    name: Deploy to Container Apps
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.provision.outputs.appUrl }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, no secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: |
          az group create \
            --name "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --location "${{ vars.AZURE_LOCATION }}" \
            --output none

      # what-if first so the deployment log records exactly what changed. On a
      # tool that holds no user data the blast radius is small, but a
      # deployment nobody can read afterwards is still a bad deployment.
      - name: Preview changes
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
              namePrefix="${{ vars.AZURE_NAME_PREFIX }}" \
              containerImage="${{ needs.build.outputs.image }}" \
              registryRequiresAuthentication=true \
              registryServer="${{ env.REGISTRY }}" \
            --no-pretty-print || true

      - name: Deploy
        id: provision
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "compass-${{ github.run_id }}" \
            --template-file infra/main.bicep \
            --parameters \
              namePrefix="${{ vars.AZURE_NAME_PREFIX }}" \
              containerImage="${{ needs.build.outputs.image }}" \
              registryRequiresAuthentication=true \
              registryServer="${{ env.REGISTRY }}" \
            --query "properties.outputs" \
            --output json > outputs.json

          APP_URL=$(jq -r '.appUrl.value' outputs.json)
          IDENTITY=$(jq -r '.managedIdentityPrincipalId.value' outputs.json)
          echo "appUrl=${APP_URL}" >> "$GITHUB_OUTPUT"
          echo "identityPrincipalId=${IDENTITY}" >> "$GITHUB_OUTPUT"

      # The deployment cannot grant the identity access to GHCR, because GHCR
      # is not an Azure resource. Fail loudly here rather than leaving a
      # container app stuck in ImagePullBackOff.
      - name: Wait for a healthy revision
        run: |
          APP_NAME=$(jq -r '.containerAppName.value' outputs.json)
          for i in $(seq 1 30); do
            STATE=$(az containerapp revision list \
              --name "$APP_NAME" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[?properties.active].properties.healthState | [0]" -o tsv)
            echo "attempt $i: revision health = ${STATE:-unknown}"
            if [ "$STATE" = "Healthy" ]; then exit 0; fi
            sleep 10
          done
          echo "No healthy revision after 5 minutes."
          az containerapp logs show --name "$APP_NAME" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --tail 100 || true
          exit 1

      - name: Smoke test the deployed instance
        run: |
          URL="${{ steps.provision.outputs.appUrl }}"
          echo "Checking ${URL}/api/health"
          curl --fail --silent --show-error --retry 6 --retry-delay 10 \
            --retry-all-errors "${URL}/api/health" | tee /dev/stderr | jq -e '.status == "ok"'
          for path in / /assess/0 /benchmark /methodology /privacy; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${URL}${path}")
            echo "${path} -> ${code}"
            [ "$code" = "200" ] || exit 1
          done

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- URL: ${{ steps.provision.outputs.appUrl }}"
            echo "- Image: \`${{ needs.build.outputs.image }}\`"
            echo "- Managed identity principal: \`${{ steps.provision.outputs.identityPrincipalId }}\`"
            echo ""
            echo "No connection strings or keys were written to app settings."
          } >> "$GITHUB_STEP_SUMMARY"
